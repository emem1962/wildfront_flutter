name: wildfront_hunter
description: A 3D first-person co-op wildlife hunting game for Android, powered by Three.js and a Render WebSocket server.
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/game/
